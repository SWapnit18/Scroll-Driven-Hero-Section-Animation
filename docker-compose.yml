services:
  itzfizz-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itzfizz-experience
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
